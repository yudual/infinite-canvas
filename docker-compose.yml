services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infinite-canvas
    restart: unless-stopped
    ports:
      - "8675:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - DB_PATH=/app/data/canvas.db
      - UPLOADS_DIR=/app/data/uploads
      - JWT_SECRET=canvas-production-jwt-secret-replace-in-env
    volumes:
      - ./data:/app/data
